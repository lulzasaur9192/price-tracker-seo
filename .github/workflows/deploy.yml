name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # needed by the keepalive step to re-enable this workflow

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NEXT_PUBLIC_SITE_URL: https://lulzasaur9192.github.io/price-tracker-seo
      # GitHub auto-disables scheduled workflows after 60 days without repo
      # activity (this killed the daily rebuild once already). Re-enabling the
      # workflow via the API resets that inactivity timer, so this step keeps
      # the cron alive indefinitely.
      - name: Keepalive — prevent 60-day scheduled-workflow auto-disable
        if: github.event_name == 'schedule'
        run: gh workflow enable deploy.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
